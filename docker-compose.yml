services:
  postgres:
    image: postgres:18
    container_name: pg-research-primary
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d research"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
