# PostgreSQL research configuration
# Apply only to the dedicated experimental instance.

# Logging useful for experiments
log_min_duration_statement = 0
log_checkpoints = on

# Statistics
track_activities = on
track_counts = on

# Keep default unless an experiment explicitly changes it.
# These are PostgreSQL 17+ settings.

